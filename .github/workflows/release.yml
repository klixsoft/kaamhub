name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0. Leave empty to work it out from the commit messages."
        required: false
        type: string
      highlights:
        description: "Optional highlights shown at the top of the release notes. Use \\n for a new line."
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide the version
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Choose the commit to release
        id: commit
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Work out the next version
        id: automatic
        if: github.event_name != 'push' && inputs.version == ''
        run: node scripts/next-version.mjs

      - name: Validate the version
        id: decide
        env:
          REQUESTED: ${{ inputs.version }}
          AUTOMATIC: ${{ steps.automatic.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${REQUESTED:-$AUTOMATIC}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "Only documentation, tests, CI or chores changed since the last release. Nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version: $VERSION. Use x.y.z, for example 0.3.0."; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != "push" ] && git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::v${VERSION} has already been released. Choose a higher version."
            exit 1
          fi
          echo "Releasing v${VERSION}"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  checks:
    name: CI
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Publish images
    needs: [prepare, checks]
    if: always() && needs.prepare.outputs.release == 'true' && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && github.event_name == 'workflow_run'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
            suffix: ""
          - name: updater
            context: docker/updater
            file: docker/updater/Dockerfile
            suffix: "-updater"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Resolve image name
        id: meta
        run: |
          echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [prepare, images]
    if: always() && needs.images.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin the installer to this release
        run: sed "s|KAAMHUB_BRANCH:-main|KAAMHUB_BRANCH:-${{ needs.prepare.outputs.tag }}|" scripts/install.sh > install.sh

      - name: Write release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_HIGHLIGHTS: ${{ inputs.highlights }}
        run: node scripts/release-notes.mjs "${{ needs.prepare.outputs.tag }}" release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: KaamHub ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: install.sh
