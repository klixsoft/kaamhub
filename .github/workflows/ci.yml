name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kaamhub
          POSTGRES_USER: kaamhub
          POSTGRES_PASSWORD: kaamhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaamhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kaamhub:kaamhub@localhost:5432/kaamhub
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-value-that-is-long-enough-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check migrations are up to date
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code --stat -- drizzle || (echo "Schema changed without a migration. Run npm run db:generate." && exit 1)
      - run: node scripts/migrate.mjs
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
